<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e3ddd2"/>
    </pattern>
    <filter id="card" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9aa3ad"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#faf9f6"/>
  <rect width="980" height="560" fill="url(#dots2)" opacity="0.5"/>

  <!-- 标题 -->
  <circle cx="46" cy="36" r="5" fill="#2f6f4f"/>
  <text x="60" y="42" font-size="18" font-weight="700" fill="#1f2328">一个 AI 系统的组成与数据流</text>

  <!-- 治理层虚线边界 -->
  <rect x="24" y="70" width="932" height="452" rx="16" fill="none" stroke="#c2c9d0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="90" font-size="12" font-weight="600" fill="#5b6470">治理层 · 权限 / 密钥 / 审计（笼罩以上所有组成）</text>

  <!-- 连接线（置于节点之下） -->
  <g stroke="#9aa3ad" stroke-width="1.8" fill="none">
    <line x1="210" y1="280" x2="376" y2="280" marker-end="url(#arw)"/>
    <line x1="490" y1="156" x2="490" y2="242" marker-end="url(#arw)"/>
    <line x1="604" y1="280" x2="766" y2="200" marker-end="url(#arw)"/>
    <line x1="604" y1="302" x2="766" y2="330" marker-end="url(#arw)"/>
    <line x1="452" y1="314" x2="250" y2="418" marker-end="url(#arw)"/>
    <line x1="490" y1="314" x2="490" y2="418" marker-end="url(#arw)"/>
  </g>

  <!-- 节点：模型端 -->
  <g filter="url(#card)">
    <rect x="380" y="98" width="220" height="58" rx="12" fill="#ffffff" stroke="#2f6f4f" stroke-width="2"/>
  </g>
  <g transform="translate(398,116)" stroke="#2f6f4f" stroke-width="1.6" fill="none">
    <rect x="0" y="0" width="16" height="16" rx="2"/><rect x="4" y="4" width="8" height="8" rx="1"/>
    <line x1="0" y1="-3" x2="0" y2="0"/><line x1="16" y1="-3" x2="16" y2="0"/>
  </g>
  <text x="424" y="124" font-size="14" font-weight="700" fill="#1f2328">模型端</text>
  <text x="424" y="143" font-size="11" fill="#5b6470">GPT / Claude / DeepSeek</text>

  <!-- 节点：编排层（核心，实色） -->
  <g filter="url(#card)">
    <rect x="380" y="246" width="220" height="68" rx="12" fill="#2f6f4f" stroke="#2f6f4f" stroke-width="2"/>
  </g>
  <g transform="translate(398,266)" stroke="#e8f1ec" stroke-width="1.6" fill="none">
    <path d="M0 4 L8 -4 L16 4 L8 12 Z"/><path d="M0 12 L8 4 L16 12 L8 20 Z" opacity="0.7"/>
  </g>
  <text x="424" y="278" font-size="14" font-weight="700" fill="#ffffff">编排层 · Agent 框架</text>
  <text x="424" y="299" font-size="11" fill="#e8f1ec">工作手册：先干啥、按啥规矩</text>

  <!-- 节点：输入与上下文端 -->
  <g filter="url(#card)">
    <rect x="40" y="247" width="170" height="66" rx="12" fill="#ffffff" stroke="#d7dbdf" stroke-width="1.8"/>
  </g>
  <g transform="translate(58,266)" stroke="#5b6470" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M2 0 L2 14 M2 7 L13 7"/><path d="M14 0 L14 14"/>
  </g>
  <text x="84" y="276" font-size="13" font-weight="700" fill="#1f2328">输入与上下文端</text>
  <text x="84" y="295" font-size="11" fill="#5b6470">用户·提示词·上下文</text>

  <!-- 节点：工具层 -->
  <g filter="url(#card)">
    <rect x="770" y="172" width="170" height="56" rx="12" fill="#ffffff" stroke="#d7dbdf" stroke-width="1.8"/>
  </g>
  <g transform="translate(788,190)" stroke="#5b6470" stroke-width="1.6" fill="none">
    <circle cx="8" cy="8" r="6"/><line x1="2" y1="2" x2="14" y2="14"/><line x1="2" y1="14" x2="14" y2="2"/>
  </g>
  <text x="812" y="196" font-size="13" font-weight="700" fill="#1f2328">工具层</text>
  <text x="812" y="214" font-size="11" fill="#5b6470">MCP / API</text>

  <!-- 节点：数据层 -->
  <g filter="url(#card)">
    <rect x="770" y="302" width="170" height="56" rx="12" fill="#ffffff" stroke="#d7dbdf" stroke-width="1.8"/>
  </g>
  <g transform="translate(788,318)" stroke="#5b6470" stroke-width="1.6" fill="none">
    <ellipse cx="8" cy="5" rx="7" ry="3"/><path d="M1 5 L1 19 A7 3 0 0 0 15 19 L15 5"/>
  </g>
  <text x="812" y="326" font-size="13" font-weight="700" fill="#1f2328">数据层</text>
  <text x="812" y="344" font-size="11" fill="#5b6470">知识库 / 记忆</text>

  <!-- 节点：执行与自动化 -->
  <g filter="url(#card)">
    <rect x="40" y="420" width="210" height="56" rx="12" fill="#ffffff" stroke="#d7dbdf" stroke-width="1.8"/>
  </g>
  <g transform="translate(58,437)" stroke="#5b6470" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <circle cx="8" cy="8" r="8"/><path d="M5 4 L13 8 L5 12 Z"/>
  </g>
  <text x="84" y="446" font-size="13" font-weight="700" fill="#1f2328">执行与自动化</text>
  <text x="84" y="464" font-size="11" fill="#5b6470">定时 / 批量</text>

  <!-- 节点：交付端 -->
  <g filter="url(#card)">
    <rect x="380" y="420" width="220" height="56" rx="12" fill="#ffffff" stroke="#d7dbdf" stroke-width="1.8"/>
  </g>
  <g transform="translate(398,437)" stroke="#5b6470" stroke-width="1.6" fill="none">
    <rect x="0" y="0" width="16" height="11" rx="1.5"/><line x1="5" y1="14" x2="11" y2="14"/><line x1="8" y1="11" x2="8" y2="14"/>
  </g>
  <text x="424" y="446" font-size="13" font-weight="700" fill="#1f2328">交付端</text>
  <text x="424" y="464" font-size="11" fill="#5b6470">PC / 手机 / 小程序</text>

  <text x="40" y="548" font-size="11" fill="#9aa3ad">实线 = 数据流 / 调用（编排层居中调度，治理层全程约束）</text>
</svg>
