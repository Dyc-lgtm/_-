<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#e7e2da"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="280" fill="#faf9f6"/>
  <rect width="1200" height="280" fill="url(#dots)" opacity="0.55"/>
  <!-- 右侧景深圆，制造呼吸 -->
  <circle cx="1030" cy="140" r="120" fill="#eef3f0"/>
  <circle cx="1148" cy="58" r="44" fill="#e8f1ec"/>
  <!-- 标记：指南针（探索者） -->
  <g transform="translate(122,140)" filter="url(#soft)">
    <circle r="52" fill="#ffffff" stroke="#2f6f4f" stroke-width="3"/>
    <circle r="52" fill="none" stroke="#2f6f4f" stroke-width="1" opacity="0.28"/>
    <path d="M0 -34 L9 0 L0 9 L-9 0 Z" fill="#2f6f4f"/>
    <path d="M0 34 L9 0 L0 -9 L-9 0 Z" fill="#cdd6d1"/>
    <circle r="4.5" fill="#2f6f4f"/>
    <g stroke="#2f6f4f" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-44"/>
      <line x1="0" y1="52" x2="0" y2="44"/>
      <line x1="-52" y1="0" x2="-44" y2="0"/>
      <line x1="52" y1="0" x2="44" y2="0"/>
    </g>
  </g>
  <!-- 文字 -->
  <text x="252" y="104" font-size="34" font-weight="700" fill="#1f2328">Distillation</text>
  <line x1="254" y1="120" x2="324" y2="120" stroke="#2f6f4f" stroke-width="3"/>
  <text x="254" y="150" font-size="16" fill="#5b6470">知识蒸馏</text>
  <text x="254" y="184" font-size="15" fill="#1f2328">在 AI 领域里摸索，把走过的路和攒下的笔记，</text>
  <text x="254" y="208" font-size="15" fill="#1f2328">蒸馏成可分享的模块</text>
  <text x="254" y="240" font-size="12" font-weight="600" fill="#2f6f4f">AI 领域探索者 · 热心分享 · MIT</text>
</svg>
